services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink
      POSTGRES_DB: paylink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink -d paylink"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://paylink:paylink@db:5432/paylink
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
